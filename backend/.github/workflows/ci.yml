name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  encoding-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check UTF-8 encoding
        run: |
          echo "Checking UTF-8 encoding for TypeScript files..."
          find src test -name "*.ts" -type f | while read file; do
            if ! iconv -f utf-8 -t utf-8 "$file" > /dev/null 2>&1; then
              echo "❌ Invalid UTF-8: $file"
              exit 1
            fi
          done
          echo "✅ All TypeScript files are valid UTF-8"

  test:
    runs-on: ubuntu-latest
    needs: encoding-check
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mvp_user
          POSTGRES_PASSWORD: mvp_secret_2026
          POSTGRES_DB: mvp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Prisma migrations
        env:
          DATABASE_URL_TEST: postgresql://mvp_user:mvp_secret_2026@localhost:5433/mvp_test?schema=public
        run: npx prisma migrate deploy
      
      - name: Run tests
        env:
          DATABASE_URL_TEST: postgresql://mvp_user:mvp_secret_2026@localhost:5433/mvp_test?schema=public
        run: npm test
      
      - name: Run integration tests
        env:
          DATABASE_URL_TEST: postgresql://mvp_user:mvp_secret_2026@localhost:5433/mvp_test?schema=public
        run: npm run test:integration
