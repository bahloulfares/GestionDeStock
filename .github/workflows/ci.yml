name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mvp_user
          POSTGRES_PASSWORD: ci_test_password_2026
          POSTGRES_DB: mvp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://mvp_user:ci_test_password_2026@localhost:5432/mvp_test?schema=public
      DATABASE_URL_TEST: postgresql://mvp_user:ci_test_password_2026@localhost:5432/mvp_test?schema=public
      TEST_PASSWORD: CI_TestPassword123!

    steps:
      - uses: actions/checkout@v4

      - name: Check UTF-8 encoding
        working-directory: backend
        run: |
          echo "Checking UTF-8 encoding for TypeScript files..."
          invalid_files=()
          while IFS= read -r file; do
            if ! iconv -f utf-8 -t utf-8 "$file" > /dev/null 2>&1; then
              invalid_files+=("$file")
              echo "❌ Invalid UTF-8: $file"
            fi
          done < <(find src test -name "*.ts" -type f)
          
          if [ ${#invalid_files[@]} -gt 0 ]; then
            echo ""
            echo "Found ${#invalid_files[@]} file(s) with invalid UTF-8 encoding"
            exit 1
          fi
          echo "✅ All TypeScript files are valid UTF-8"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci
        continue-on-error: true
        # Dette technique : 343 problèmes de lint à traiter dans une tâche séparée

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Integration Tests
        run: npm run test:integration
