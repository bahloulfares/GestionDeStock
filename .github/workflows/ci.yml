name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mvp_user
          POSTGRES_PASSWORD: ci_test_password_2026
          POSTGRES_DB: mvp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://mvp_user:ci_test_password_2026@localhost:5432/mvp_test?schema=public
      DATABASE_URL_TEST: postgresql://mvp_user:ci_test_password_2026@localhost:5432/mvp_test?schema=public
      TEST_PASSWORD: CI_TestPassword123!

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:ci
        continue-on-error: true
        # Dette technique : 343 problèmes de lint à traiter dans une tâche séparée

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Integration Tests
        run: npm run test:integration
